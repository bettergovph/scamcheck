<!DOCTYPE html>
<html lang="en-PH" prefix="og: https://ogp.me/ns#">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary Meta Tags -->
  <title>Free Scam & Phishing Detector | BetterGov.ph</title>
  <meta name="title" content="Free Scam & Phishing Detector | BetterGov.ph">

    content="Protect yourself from scams! Free AI-powered tool to detect spam, phishing, and fraudulent messages. Analyze SMS and emails instantly with our Philippine-focused scam detector.">
  <meta name="keywords"
    content="scam detector, phishing detector, spam checker, GCash scam, SMS scam, email phishing, fraud detection, Philippines scams, BetterGov, free security tool">
  <meta name="author" content="BetterGov.ph">

  <link rel="canonical" href="https://scamcheck.ph/">

    content="Protect yourself from scams! Free AI-powered tool to detect spam, phishing, and fraudulent messages.">
  <meta property="twitter:image" content="https://scamcheck.ph/better-horizontal-logo.png">

  <!-- Additional Meta Tags -->
  <meta name="theme-color" content="#667eea">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Scam Detector">

  <!-- Geographic Tags -->
  <meta name="geo.region" content="PH">
  <meta name="geo.placename" content="Philippines">

  <!-- Language -->
  <meta http-equiv="content-language" content="en-PH">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <!-- Structured Data / JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Scam & Phishing Detector",
    "applicationCategory": "SecurityApplication",
    "operatingSystem": "Web Browser",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "PHP"
    },
    "description": "Free AI-powered tool to detect spam, phishing, and fraudulent messages. Analyze SMS and emails instantly with our Philippine-focused scam detector.",
    "url": "https://scamcheck.ph/",
    "publisher": {
      "@type": "Organization",
      "name": "BetterGov.ph",
      "url": "https://bettergov.ph",
      "logo": "https://scamcheck.bettegov.ph/better-horizontal-logo.png"
    },
    "featureList": [
      "AI-powered spam detection",
      "Phishing message analysis",
      "Real-time threat detection",
      "Free to use",
      "No data storage",
      "Privacy-focused"
    ],
    "inLanguage": "en-PH",
    "isAccessibleForFree": true
  }
  </script>

  <style>
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-slideIn {
      animation: slideIn 0.3s ease-out;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col gap-8 items-center justify-center p-2 md:p-5 bg-gray-200">
  <a href="https://bettergov.ph" target="_blank" rel="noopener noreferrer">
    <img src="/better-horizontal-logo.png" alt="" class="w-64 h-16 md:w-120 md:h-18 mx-auto" />
  </a>
  <div class="bg-white shadow-2xl max-w-2xl w-full px-2 md:px-10 py-4 md:py-10">

    <!-- Language Selector -->
    <div class="mb-4 flex justify-end">
      <select id="languageSelect" 
        class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
        onchange="changeLanguage(this.value)">
        <option value="en">English</option>
        <option value="tl">Filipino</option>
      </select>
    </div>

    <h1 class="text-3xl font-bold text-gray-800 mb-2 text-center" data-i18n="title">🛡️ Scam & Phishing Detector</h1>
    <p class="text-sm text-gray-600 mb-8 text-center" data-i18n="subtitle">Test your messages for spam and phishing attempts</p>

    <textarea id="textInput"
      class="w-full min-h-[150px] p-4 border-2 border-gray-200 rounded-xl text-base resize-y transition-colors focus:outline-none focus:border-indigo-500"
      data-i18n-placeholder="placeholder"
      placeholder="Paste your email or SMS text here to check if it's spam or phishing...&#10;&#10;Example: 'URGENT: Your account has been suspended. Click here to verify your identity immediately!'"></textarea>

    <button id="checkButton" onclick="checkText()"
      class="w-full py-4 mt-5 bg-blue-600 text-white rounded-xl text-base font-semibold cursor-pointer transition-all hover:-translate-y-0.5 hover:shadow-lg hover:shadow-indigo-500/40 active:translate-y-0 disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none"
      data-i18n="analyzeButton">
      Analyze Text
    </button>

    <div class="mt-5 flex justify-center items-center">
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAB4b4PFcxkn3-61f" data-callback="onTurnstileSuccess"></div>
    </div>

    <div id="result" class="hidden mt-8 p-5 rounded-xl"></div>

    <div class="mt-5 p-4 bg-gray-50 rounded-xl">
      <h3 class="text-sm font-medium mb-3 text-gray-600" data-i18n="examplesTitle">Try these examples:</h3>
      <button
        class="inline-block py-2 px-3 m-1 mr-2 bg-white border border-gray-200 rounded-md text-xs cursor-pointer transition-all hover:bg-indigo-500 hover:text-white hover:border-indigo-500 text-black"
        onclick="setExample(0)">📱 <span data-i18n="example1">GCash Scam</span></button>
      <button
        class="inline-block py-2 px-3 m-1 mr-2 bg-white border border-gray-200 rounded-md text-xs cursor-pointer transition-all hover:bg-indigo-500 hover:text-white hover:border-indigo-500 text-black"
        onclick="setExample(1)">📦 <span data-i18n="example2">Delivery SMS</span></button>
      <button
        class="inline-block py-2 px-3 m-1 mr-2 bg-white border border-gray-200 rounded-md text-xs cursor-pointer transition-all hover:bg-indigo-500 hover:text-white hover:border-indigo-500 text-black"
        onclick="setExample(2)">🏦 <span data-i18n="example3">Bank Alert</span></button>
      <button
        class="inline-block py-2 px-3 m-1 mr-2 bg-white border border-gray-200 rounded-md text-xs cursor-pointer transition-all hover:bg-indigo-500 hover:text-white hover:border-indigo-500 text-black"
        onclick="setExample(3)">₿ <span data-i18n="example4">Crypto Scam</span></button>
      <button
        class="inline-block py-2 px-3 m-1 mr-2 bg-white border border-gray-200 rounded-md text-xs cursor-pointer transition-all hover:bg-indigo-500 hover:text-white hover:border-indigo-500 text-black"
        onclick="setExample(4)">🎁 <span data-i18n="example5">Prize Scam</span></button>
      <button
        class="inline-block py-2 px-3 m-1 mr-2 bg-white border border-gray-200 rounded-md text-xs cursor-pointer transition-all hover:bg-indigo-500 hover:text-white hover:border-indigo-500 text-black"
        onclick="setExample(5)">💼 <span data-i18n="example6">Job Scam</span></button>
      <button
        class="inline-block py-2 px-3 m-1 mr-2 bg-white border border-gray-200 rounded-md text-xs cursor-pointer transition-all hover:bg-indigo-500 hover:text-white hover:border-indigo-500 text-black"
        onclick="setExample(6)">✅ <span data-i18n="example7">Legitimate</span></button>
    </div>
  </div>

  <div class="text-gray-600 text-sm mt-4">
    <p data-i18n="footer">This service is provided for free by <a href="https://bettergov.ph" target="_blank"
        rel="noopener noreferrer">BetterGov.ph</a></p>
  </div>

  <script>
    // Translations
    const translations = {
      en: {
        title: "🛡️ Scam & Phishing Detector",
        subtitle: "Test your messages for spam and phishing attempts",
        placeholder: "Paste your email or SMS text here to check if it's spam or phishing...\n\nExample: 'URGENT: Your account has been suspended. Click here to verify your identity immediately!'",
        analyzeButton: "Analyze Text",
        examplesTitle: "Try these examples:",
        example1: "GCash Scam",
        example2: "Delivery SMS",
        example3: "Bank Alert",
        example4: "Crypto Scam",
        example5: "Prize Scam",
        example6: "Job Scam",
        example7: "Legitimate",
        footer: "This service is provided for free by BetterGov.ph",
        analyzing: "Analyzing...",
        confidence: "Confidence",
        enterText: "Please enter some text to analyze",
        completeCaptcha: "Please complete the CAPTCHA verification"
      },
      tl: {
        title: "🛡️ Detektor ng Scam at Phishing",
        subtitle: "Suriin ang inyong mensahe para sa spam at phishing",
        placeholder: "I-paste dito ang iyong email o SMS text upang suriin kung ito ay spam o phishing...\n\nHalimbawa: 'URGENT: Your account has been suspended. Click here to verify your identity immediately!'",
        analyzeButton: "Suriin ang Teksto",
        examplesTitle: "Subukan ang mga ito:",
        example1: "GCash Scam",
        example2: "Delivery SMS",
        example3: "Bank Alert",
        example4: "Crypto Scam",
        example5: "Prize Scam",
        example6: "Job Scam",
        example7: "Lehitimo",
        footer: "Ang serbisyong ito ay libre mula sa BetterGov.ph",
        analyzing: "Sinusuri...",
        confidence: "Katiyakan",
        enterText: "Ilagay ang teksto na naglalaman ng scam.",
        completeCaptcha: "Kumpletuhin ang CAPTCHA verification"
      }
    };

    // Language state
    let currentLang = localStorage.getItem('preferredLanguage') || 'en';

    // Language functions
    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('preferredLanguage', lang);
      updateUILanguage();
    }

    function updateUILanguage() {
      const t = translations[currentLang] || translations.en;
      
      // Update all elements with data-i18n attribute
      document.querySelectorAll('[data-i18n]').forEach(elem => {
        const key = elem.getAttribute('data-i18n');
        if (!t[key]) {
          return;
        }

        if (key === 'footer') {
          elem.innerHTML = t[key];
        } else {
          elem.textContent = t[key];
        }
      });

      // Update placeholder
      const textInput = document.getElementById('textInput');
      if (textInput && t.placeholder) {
        textInput.placeholder = t.placeholder;
      }

      // Update language selector
      document.getElementById('languageSelect').value = currentLang;
    }

    // Worker URL automatically uses the same origin (works for both dev and production)
    const WORKER_URL = window.location.origin;

    // Store Turnstile token
    let turnstileToken = null;
    let isSessionVerified = sessionStorage.getItem('captchaVerified') === 'true';

    // Callback when Turnstile verification succeeds
    function onTurnstileSuccess(token) {
      turnstileToken = token;
      // Mark session as verified
      sessionStorage.setItem('captchaVerified', 'true');
      isSessionVerified = true;

      // Hide CAPTCHA after first successful verification
      const captchaContainer = document.querySelector('.captcha-container');
      if (captchaContainer) {
        captchaContainer.style.display = 'none';
      }
    }

    // Check if already verified and hide CAPTCHA
    window.addEventListener('load', () => {
      // Initialize language
      updateUILanguage();
      
      if (isSessionVerified) {
        const captchaContainer = document.querySelector('.captcha-container');
        if (captchaContainer) {
          captchaContainer.style.display = 'none';
        }
      }
    });

    // Function to clear session verification (for testing/logout)
    function clearSessionVerification() {
      sessionStorage.removeItem('captchaVerified');
      isSessionVerified = false;
      location.reload();
    }

    const examples = [
      // GCash Phishing Scam
      "FREE MSG: GCASH ALERT! Your account will be locked due to suspicious activity. Verify now to avoid suspension. Click: gcash-verify.com/ph/account?user=09171234567 DO NOT IGNORE!",

      // Fake Delivery/Package SMS
      "LBC: Your package is held at customs. Pay PHP 250 clearance fee within 24hrs or item will be returned. Track & pay here: lbc-ph-delivery.net/track/PH47829 Reference: PKG-2024-8372",

      // Bank Phishing (BDO/BPI style)
      "BDO ALERT: Unusual transaction detected on your account ending in 4721. Amount: PHP 25,850.00. If this wasn't you, verify your account immediately at bdo-secure-online.com to block this transaction. Call 8631-8000.",

      // Crypto Investment Scam
      "Hi po! I'm Sarah from CryptoWealth PH 🚀 Earn 300% returns in 30 days! Minimum investment 5,000 PHP. We have 10,000+ Filipino investors already earning daily! Join our Telegram: t.me/cryptowealthph Message ko lang boss for guaranteed passive income! Legit po ito 💯",

      // Prize/Lottery Scam
      "CONGRATULATIONS! Your mobile number 0917-XXX-XXXX won PHP 500,000 in the SMART Raffle Promo 2024! To claim, send full name, address, and valid ID to claimprize2024@outlook.com Reference Code: SM-PH-8374. Valid for 48 hours only!",

      // Fake Job Offer Scam  
      "Good day! We reviewed your profile and you're qualified for our HOME-BASED DATA ENCODER position. Salary: 35,000-45,000/month, work from home, no experience needed! Send 500 PHP processing fee to GCash 09178765432 (Training Materials Fee) then we'll send your starter kit and account. Limited slots only!",

      // Legitimate Message
      "Hi! This is Jenny from the dentist's office. Just confirming your appointment tomorrow, January 15 at 3:00 PM with Dr. Cruz. Please arrive 10 minutes early to update your records. If you need to reschedule, please call us at 02-8234-5678. See you tomorrow!"
    ];

    function setExample(index) {
      document.getElementById('textInput').value = examples[index];
    }

    async function checkText() {
      const t = translations[currentLang] || translations.en;
      const textInput = document.getElementById('textInput');
      const checkButton = document.getElementById('checkButton');
      const resultDiv = document.getElementById('result');

      const text = textInput.value.trim();

      if (!text) {
        alert(t.enterText);
        return;
      }

      // Only require CAPTCHA for first request in session
      if (!isSessionVerified && !turnstileToken) {
        alert(t.completeCaptcha);
        return;
      }

      // Disable button and show loading
      checkButton.disabled = true;
      checkButton.textContent = t.analyzing;
      resultDiv.classList.remove('show');

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            text,
            turnstileToken: turnstileToken || null,
            sessionVerified: isSessionVerified
          }),
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }

        displayResult(data);

      } catch (error) {
        resultDiv.className = 'block mt-8 p-5 rounded-xl bg-red-50 border-2 border-red-200 text-red-700 animate-slideIn';
        resultDiv.innerHTML = `
                    <div class="text-lg font-semibold mb-4">❌ Error</div>
                    <div class="text-sm">${error.message}</div>
                `;
      } finally {
        checkButton.disabled = false;
        checkButton.textContent = t.analyzeButton;
      }
    }

    function displayResult(data) {
      const t = translations[currentLang] || translations.en;
      const resultDiv = document.getElementById('result');
      const interpretation = data.interpretation;
      const predictions = data.predictions;

      const isSpam = interpretation.isSpam;
      resultDiv.className = `block mt-8 p-5 rounded-xl animate-slideIn ${isSpam ? 'bg-red-50 border-2 border-red-200' : 'bg-green-50 border-2 border-green-200'}`;

      let predictionsHTML = '';
      if (predictions && Array.isArray(predictions)) {
        predictionsHTML = predictions.map(pred => `
                    <div class="bg-white p-2.5 my-1 rounded-md flex justify-between items-center">
                        <span class="font-semibold">${pred.label}</span>
                        <span class="text-indigo-600 font-semibold">${(pred.score * 100).toFixed(2)}%</span>
                    </div>
                `).join('');
      }

      resultDiv.innerHTML = `
                <div class="text-lg font-semibold mb-4">${interpretation.message}</div>
                <div class="text-sm text-gray-600">
                    <strong>${t.confidence}:</strong> ${interpretation.confidence.toUpperCase()} (${interpretation.confidenceScore})
                </div>

            `;
    }

    // Allow Enter key to submit (with Ctrl/Cmd)
    document.getElementById('textInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        checkText();
      }
    });
  </script>
</body>

</html>
